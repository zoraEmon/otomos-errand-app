version: '3.8'

services:
  otomos-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: otomos_backend
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=otomos_dev_secret_key_2026
    volumes:
      # Persist SQLite data across container restarts
      - ./server/dev.db:/usr/src/app/server/dev.db
      # Optional: Mount src directories for live-reloading with tsx
      - ./server/src:/usr/src/app/server/src
      - ./shared/contracts:/usr/src/app/shared/contracts

  otomos-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: otomos_frontend
    depends_on:
      - otomos-api
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    volumes:
      - ./frontend:/usr/src/app/frontend
      - ./shared:/usr/src/app/shared
      - /usr/src/app/frontend/node_modules
      - /usr/src/app/shared/node_modules